<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beacon — Offline</title>
    <style>
      body {
        margin: 0;
        font: 18px/1.6 system-ui, sans-serif;
        background: #1e2a4a;
        color: #fff;
        display: grid;
        place-items: center;
        height: 100vh;
        text-align: center;
      }
      .card { padding: 2rem; max-width: 22rem; }
      h1 { color: #e8b84b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This page has not been opened on this phone yet, so it needs a signal the first time. Every other screen in Beacon works without one. Go back, or reconnect and it will open.</p>
    </div>
  </body>
</html>
