[package]
name = "hope-beacon-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
base64 = "0.22"
